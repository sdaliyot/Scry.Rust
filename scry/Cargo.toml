# The Scry.Rust library. A separate workspace from ../demos, which depend on it by path.
[workspace]
resolver = "3"
members = ["crates/scry-rs", "crates/scry-rs-derive", "crates/scry-rs-cargo", "crates/scry-rs-client", "crates/scry-rs-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Shahar Daliyot"]
repository = "https://github.com/sdaliyot/Scry.Rust"
homepage = "https://github.com/sdaliyot/Scry.Rust"
rust-version = "1.91"
keywords = ["reflection", "inspection", "debugging", "testing", "dioxus"]
categories = ["development-tools::debugging", "development-tools::testing"]

[workspace.dependencies]
serde_json = "1"

# Smaller debug builds: line tables give file and line numbers in panics and backtraces, but not
# variables in a debugger. Dependencies get no debug info at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
