[package]
name = "scry-rs"
description = "Inspect and change the state of a running Rust process."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Code still says `use scry::...` and `#[derive(scry::Reflect)]`; the derive emits `::scry::` paths.
[lib]
name = "scry"

[features]
default = ["script", "lock_api"]
# Locks built on `lock_api`: parking_lot, spin and others.
lock_api = ["dep:lock_api"]
# tokio::sync locks, and the app's runtime for calling async functions. `cargo scry` turns this on for an app that depends on tokio.
tokio = ["dep:tokio"]
# The `eval` command: Rhai scripts that navigate, read and write the registry.
script = ["dep:rhai"]
# Reflect impls for Dioxus signals. They are owned by the UI thread, so a registry that holds them
# has to be driven from that thread too.
dioxus = ["dep:dioxus-signals", "dep:dioxus-core", "dep:dioxus-document", "dep:dioxus-hooks", "dep:futures-channel", "dep:futures-util"]
# `ui.route` and `ui.routes`: the app's router. `cargo scry` turns this on for an app that depends on dioxus-router.
dioxus-router = ["dioxus", "dep:dioxus-router"]
# `screenshot`: the page as the webview renders it. `cargo scry` turns this on for an app that depends on dioxus-desktop.
dioxus-desktop = ["dioxus", "dep:dioxus-desktop", "dep:webview2-com", "dep:windows-core"]

[dependencies]
scry-rs-derive = { path = "../scry-rs-derive" }
serde_json.workspace = true
# Gathers the registrations the generator emits next to each static, across all crates.
linkme = "0.3"
# The endpoint's capability token.
getrandom = "0.3"
# Third-party types are read and written through their `Serialize`/`Deserialize` impls; see `probes`.
serde = "1"
lock_api = { version = "0.4", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["sync", "rt"] }
rhai = { version = "1.27", optional = true }
dioxus-signals = { version = "0.7", optional = true }
dioxus-core = { version = "0.7", optional = true }
# `js`, `click`, `type` and `text`: the page, through the webview.
dioxus-document = { version = "0.7", optional = true }
# Resources and actions (`use_resource`, `use_action`).
dioxus-hooks = { version = "0.7", optional = true }
dioxus-router = { version = "0.7", optional = true }
# The app's webview. Only the features it needs to compile: the app's own choice applies.
dioxus-desktop = { version = "0.7", optional = true, default-features = false, features = ["tokio_runtime"] }
futures-channel = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false }

# `screenshot` on Windows: the DevTools protocol of the WebView2 wry runs on (the versions wry 0.53 uses).
[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.38", optional = true }
windows-core = { version = "0.61", optional = true }

[dev-dependencies]
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"
tokio = { version = "1", default-features = false, features = ["sync", "rt", "time"] }
# The crate's own tests use its tokio support (tests/async_calls.rs), whatever else is built.
scry = { package = "scry-rs", path = ".", features = ["tokio"] }
