[package]
name = "console-demo"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
# Builds the Scry.Rust registry into the app. Off by default: a normal build carries none of it.
scry = ["dep:scry"]

# How `cargo scry` treats this crate. `next_random` runs in the worker's hot loop, so it gets no
# hook point.
[package.metadata.scry.hooks]
exclude = ["crate::util::next_random"]

[dependencies]
scry = { package = "scry-rs", path = "../../scry/crates/scry-rs", optional = true }
# Attribute macros that rewrite the functions they sit on, as web frameworks' do.
demo-macros = { path = "../demo-macros" }
# Third-party types, as most apps hold them: a parking_lot lock around ids and timestamps with
# serde support. Scry has no code for any of these crates.
parking_lot = "0.12"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# Has `FromStr` and `Debug` but no serde: reached inside the lock and the `Vec` by peeling.
regex = { version = "1", default-features = false, features = ["std"] }
