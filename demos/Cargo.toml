# The demo apps: deliberately a separate workspace from the Scry.Rust library in ../scry, so they
# consume it the way an outside project would - through a dependency, not as a workspace sibling.
[workspace]
resolver = "3"
members = ["console-demo", "demo-macros", "dx-demo", "web-demo"]

[workspace.package]
edition = "2024"
publish = false

# Smaller debug builds: line tables give file and line numbers in panics and backtraces, but not
# variables in a debugger. Dependencies get no debug info at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
