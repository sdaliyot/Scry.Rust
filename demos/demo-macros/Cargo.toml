[package]
name = "demo-macros"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Attribute macros that rewrite the functions they sit on, as web frameworks' do, for the console demo."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
