[package]
name = "web-demo"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
# Builds the Scry.Rust registry into the app. Off by default: a normal build carries none of it.
scry = ["dep:scry"]

[dependencies]
scry = { package = "scry-rs", path = "../../scry/crates/scry-rs", optional = true }
# A web framework whose route macros turn each handler into a service type: `cargo scry` has never
# heard of them, and works out by itself what each handler keeps.
actix-web = { version = "4", default-features = false, features = ["macros"] }
