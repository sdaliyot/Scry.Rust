# Builds the scry-rs command line for each platform and publishes the archives as a GitHub release.
# Triggered by pushing a tag that matches the workspace version, e.g. `v0.1.0`.
#
# The archive names carry no version, so the latest one is always at
#   https://github.com/sdaliyot/Scry.Rust/releases/latest/download/scry-rs-<target>.<zip|tar.gz>
# which is what skills/scry-rs/SKILL.md downloads.
#
# The crates (scry-rs-derive, scry-rs, scry-rs-cargo, in that order) are published to crates.io
# separately, with `cargo publish`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # Each on its own platform, as CI tests it, so each binary can be run before it ships.
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the tag matches the workspace version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' scry/Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the workspace version $version" >&2
            exit 1
          fi

      # Installs rustup where the image has none (the Arm64 Windows image).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: scry
        run: cargo build --release --locked -p scry-rs-cli --target ${{ matrix.target }}

      - name: Check that it runs
        shell: bash
        run: |
          version=$(scry/target/${{ matrix.target }}/release/scry-rs --version)
          echo "scry-rs $version"
          [ "v$version" = "$GITHUB_REF_NAME" ]

      - name: Package
        shell: bash
        run: |
          name=scry-rs-${{ matrix.target }}
          mkdir -p dist/$name
          cp LICENSE THIRD-PARTY-NOTICES.md dist/$name/
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp scry/target/${{ matrix.target }}/release/scry-rs.exe dist/$name/
            (cd dist && 7z a -tzip $name.zip $name > /dev/null)
          else
            cp scry/target/${{ matrix.target }}/release/scry-rs dist/$name/
            tar -C dist -czf dist/$name.tar.gz $name
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: scry-rs-${{ matrix.target }}
          path: dist/scry-rs-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release and upload its assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum scry-rs-* > SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
