# Format, lint and test the scry workspace, and build the demos with `cargo scry`, on Windows, Linux
# and macOS. Also checks that the workspace still builds with the oldest supported Rust.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt

      # Dioxus desktop (the dx-demo and scry-rs's dioxus-desktop feature) needs WebKitGTK on Linux.
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Format
        working-directory: scry
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: scry
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: scry
        run: cargo test --workspace

      - name: Build the demos with cargo scry
        working-directory: demos
        shell: bash
        run: |
          cargo build --manifest-path ../scry/Cargo.toml -p scry-rs-cargo
          ../scry/target/debug/cargo-scry scry build --workspace

  msrv:
    name: Oldest supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Keep in step with `rust-version` in scry/Cargo.toml.
      - name: Rust 1.91
        run: rustup toolchain install 1.91 --profile minimal --no-self-update

      - name: Check
        working-directory: scry
        run: cargo +1.91 check --workspace --all-targets
